<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TrendAI{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{

        min-height:100vh;

        background:
        radial-gradient(circle at top left,#22d3ee30,transparent 35%),
        radial-gradient(circle at bottom right,#84cc1630,transparent 35%),
        linear-gradient(
            135deg,
            #111827 0%,
            #1e293b 50%,
            #111827 100%
        );

        color:#f8fafc;

        font-family:'Segoe UI',sans-serif;
    }

    .sidebar{

        position:fixed;

        left:0;
        top:0;

        width:280px;
        height:100vh;

        background:rgba(17,24,39,.90);

        backdrop-filter:blur(20px);

        border-right:1px solid rgba(34,211,238,.15);

        padding:30px;
    }

    .logo{

        font-size:36px;

        font-weight:900;

        margin-bottom:50px;

        background:linear-gradient(
            90deg,
            #22d3ee,
            #84cc16
        );

        -webkit-background-clip:text;
        -webkit-text-fill-color:transparent;
    }

    .menu-item{

        display:block;

        padding:14px 18px;

        margin-bottom:10px;

        color:#cbd5e1;

        text-decoration:none;

        border-radius:16px;

        transition:.3s;
    }

    .menu-item:hover{

        background:rgba(255,255,255,.05);

        border:1px solid #84cc16;

        color:#84cc16;
    }

    .content{

        margin-left:280px;

        padding:40px;
    }

    .card-ai{

        background:rgba(30,41,59,.85);

        border:1px solid rgba(34,211,238,.15);

        border-radius:24px;

        padding:25px;

        backdrop-filter:blur(12px);

        box-shadow:
        0 10px 30px rgba(0,0,0,.25);

        margin-bottom:25px;
    }

    .metric{

        font-size:40px;

        font-weight:900;

        color:#22d3ee;
    }

    .btn-trend{

        background:transparent;

        border:2px solid #84cc16;

        color:#84cc16;

        border-radius:16px;

        padding:12px 24px;

        font-weight:700;

        text-decoration:none;
    }

    .btn-trend:hover{

        background:#84cc16;

        color:#111827;
    }

    .hero-icon{

        width:100px;

        height:100px;

        border-radius:24px;

        display:flex;

        align-items:center;

        justify-content:center;

        font-size:42px;

        margin:auto;

        border:1px solid rgba(132,204,22,.25);

        background:rgba(255,255,255,.03);
    }

    .table{
        color:white;
    }

    .table th{
        color:#22d3ee;
    }

    .form-control{

        background:#0f172a;

        border:1px solid #334155;

        color:white;
    }

    .form-control:focus{

        background:#0f172a;

        color:white;

        border-color:#22d3ee;

        box-shadow:none;
    }

    </style>

</head>

<body>

<div class="sidebar">

    <div class="logo">
        TrendAI
    </div>

    <a href="/" class="menu-item">🏠 Dashboard</a>

    <a href="/" class="menu-item">🔥 Trend Discovery</a>

    <a href="/products/" class="menu-item">📦 Products</a>

    <a href="/ai/" class="menu-item">🤖 AI Studio</a>

    <a href="/analytics/dashboard/" class="menu-item">📈 Analytics</a>

    <a href="/analytics/dashboard/" class="menu-item">🏆 Winners</a>

    <a href="/admin/" class="menu-item">⚙ Admin</a>

</div>

<div class="content">

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
