<!-- Вивід зображення товару -->
<img src="{{ product.image.url }}" alt="{{ product.title }}" style="max-width:300px;">

<!-- Назва товару -->
<h2>{{ product.title }}</h2>

<!-- Опис товару -->
<p>{{ product.description }}</p>

<!-- Ціна товару -->
<p><strong>Price:</strong> {{ product.price }}</p>

<!-- Кнопка переходу на партнерську сторінку -->
<!-- Використовуємо go_redirect для трекінгу кліків -->
<a href="{% url 'go_redirect' product.pk %}" class="btn btn-primary">Buy now</a>
