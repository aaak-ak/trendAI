{% extends "product_engine/base.html" %}

{% block title %}
AI Generator
{% endblock %}

{% block content %}

<div class="card-ai">

    <h1 style="
        font-size:56px;
        font-weight:900;">
        🤖 AI Content Generator
    </h1>

    <p class="text-secondary">
        Generate descriptions, hooks, hashtags
        and product content automatically.
    </p>

</div>

<div class="card-ai">

    <form method="post">

        {% csrf_token %}

        <label class="mb-3">
            Select Product
        </label>

        <select
            name="title"
            class="form-control"
            required>

            {% for product in products %}

                <option value="{{ product.title }}">
                    {{ product.title }}
                </option>

            {% endfor %}

        </select>

        <button
            type="submit"
            class="btn-trend mt-4">

            Generate Content

        </button>

    </form>

</div>

{% endblock %}
